[package]
name = "sacd-tool"
version = "0.1.0"
edition = "2024"
description = "Cross-platform SACD ISO to DSF extraction tool (local ISO reader, ScarletBook parser, DST decoder)."
license = "Apache-2.0"

[[bin]]
name = "sacd-tool"
path = "src/main.rs"

[lib]
name = "sacd_tool"
path = "src/lib.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
anyhow = "1.0.100"
byteorder = "1.5.0"
chrono = "0.4"
clap = { version = "4.5.54", features = ["derive"] }
dst-decoder = "0.1.1"
env_logger = "0.11.8"
indicatif = "0.18"
log = "0.4.29"
rayon = "1.12"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
